[package]
name = "csn-media-bridge-tauri"
version = "1.0.0"
description = "Tauri host for CSN Media Bridge."
authors = ["CSN Media Bridge"]
edition = "2021"

[lib]
name = "csn_media_bridge_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "6.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.13.5", default-features = true, features = ["json"] }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
