name: Release Desktop App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Create or update release shell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    name: Build ${{ matrix.label }}
    needs: create-release
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple silicon)
            runner: macos-14
            bundles: app,dmg
          - label: Windows (x64)
            runner: windows-latest
            bundles: nsis,msi
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # The Rust build dominates the clock on a cold runner, so its artifacts
      # are cached per platform.
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the renderer and the host
        run: pnpm run release:check

      # Tauri's updater will not install an artifact it cannot verify, so every
      # bundle is signed here. The private key lives only in repository secrets.
      - name: Build the desktop bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Public OAuth coordinates, not secrets. Empty ships an ungated
          # build, so set these as repository *variables* once the Clerk OAuth
          # application exists.
          CLERK_OAUTH_ISSUER: ${{ vars.CLERK_OAUTH_ISSUER }}
          CLERK_OAUTH_CLIENT_ID: ${{ vars.CLERK_OAUTH_CLIENT_ID }}
          APP_UPDATE_BASE_URL: ${{ vars.APP_UPDATE_BASE_URL }}
        run: pnpm exec tauri build --bundles ${{ matrix.bundles }}

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/*/*.dmg
                 src-tauri/target/release/bundle/*/*.msi
                 src-tauri/target/release/bundle/*/*-setup.exe
                 src-tauri/target/release/bundle/*/*.app.tar.gz
                 src-tauri/target/release/bundle/*/*.sig)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No installers were produced by the Tauri bundler." >&2
            exit 1
          fi

          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

      # One entry per platform, merged into a single latest.json below.
      - name: Describe this platform's update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          # The updater installs from the signed artifact, which on macOS is the
          # .app tarball rather than the .dmg a human downloads.
          case "${{ runner.os }}" in
            macOS)   target="darwin-aarch64"; installers=(src-tauri/target/release/bundle/macos/*.app.tar.gz) ;;
            Windows) target="windows-x86_64";  installers=(src-tauri/target/release/bundle/nsis/*-setup.exe) ;;
            *)       echo "Unsupported runner." >&2; exit 1 ;;
          esac

          if [ ${#installers[@]} -eq 0 ]; then
            echo "No signed updater artifact was produced for ${{ runner.os }}." >&2
            exit 1
          fi

          installer="${installers[0]}"
          signature=$(cat "${installer}.sig")
          version="${GITHUB_REF_NAME#v}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$installer" | sed 's/ /%20/g')"

          mkdir -p feed
          printf '{"%s":{"signature":"%s","url":"%s"}}' "$target" "$signature" "$url" > "feed/${target}.json"

      - name: Upload the update fragment
        uses: actions/upload-artifact@v4
        with:
          name: feed-${{ runner.os }}
          path: feed

  publish-feed:
    name: Publish Update Feed
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Collect the update fragments
        uses: actions/download-artifact@v4
        with:
          pattern: feed-*
          path: fragments
          merge-multiple: true

      # `latest.json` is what the app polls: one manifest listing every
      # platform's signed installer for this version.
      - name: Merge into latest.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p pages
          jq -s \
            --arg version "$version" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, pub_date: $pub_date, platforms: add}' \
            fragments/*.json > pages/latest.json
          cat pages/latest.json

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
