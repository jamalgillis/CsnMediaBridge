name: Release Desktop App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Create or update release shell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    name: Build ${{ matrix.label }}
    needs: create-release
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple silicon)
            runner: macos-14
            bundles: app,dmg
          - label: Windows (x64)
            runner: windows-latest
            bundles: nsis,msi
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # The Rust build dominates the clock on a cold runner, so its artifacts
      # are cached per platform.
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the renderer and the host
        run: pnpm run release:check

      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ] || [ -z "$KEYCHAIN_PASSWORD" ]; then
            echo "Missing APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, or KEYCHAIN_PASSWORD." >&2
            echo "macOS releases must be Developer ID signed and notarized before public distribution." >&2
            exit 1
          fi

          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          cert_info=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -n 1)
          if [ -z "$cert_info" ]; then
            echo "No Developer ID Application certificate was found in the imported keychain." >&2
            security find-identity -v -p codesigning build.keychain
            exit 1
          fi

          cert_id=$(echo "$cert_info" | awk -F'"' '{print $2}')
          echo "APPLE_SIGNING_IDENTITY=$cert_id" >> "$GITHUB_ENV"
          echo "Imported Apple signing identity: $cert_id"

      # Tauri's updater signing key verifies app updates. Apple signing and
      # notarization verify downloaded macOS apps for Gatekeeper.
      - name: Build the desktop bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Public OAuth coordinates, not secrets. Empty ships an ungated
          # build, so set these as repository *variables* once the Clerk OAuth
          # application exists.
          CLERK_OAUTH_ISSUER: ${{ vars.CLERK_OAUTH_ISSUER }}
          CLERK_OAUTH_CLIENT_ID: ${{ vars.CLERK_OAUTH_CLIENT_ID }}
          APP_UPDATE_BASE_URL: ${{ vars.APP_UPDATE_BASE_URL }}
        run: pnpm exec tauri build --bundles ${{ matrix.bundles }}

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/*/*.dmg
                 src-tauri/target/release/bundle/*/*.msi
                 src-tauri/target/release/bundle/*/*-setup.exe
                 src-tauri/target/release/bundle/*/*.app.tar.gz
                 src-tauri/target/release/bundle/*/*.sig)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No installers were produced by the Tauri bundler." >&2
            exit 1
          fi

          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

      # One entry per platform, merged into latest.json for the updater and
      # downloads.json for the human download page below.
      - name: Describe this platform's update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          # The updater installs from the signed artifact, which on macOS is the
          # .app tarball rather than the .dmg a human downloads.
          case "${{ runner.os }}" in
            macOS)
              target="darwin-aarch64"
              download_key="macos"
              download_label="Download for macOS"
              installers=(src-tauri/target/release/bundle/macos/*.app.tar.gz)
              human_installers=(src-tauri/target/release/bundle/dmg/*.dmg)
              ;;
            Windows)
              target="windows-x86_64"
              download_key="windows"
              download_label="Download for Windows"
              installers=(src-tauri/target/release/bundle/nsis/*-setup.exe)
              human_installers=(src-tauri/target/release/bundle/nsis/*-setup.exe)
              ;;
            *)       echo "Unsupported runner." >&2; exit 1 ;;
          esac

          if [ ${#installers[@]} -eq 0 ]; then
            echo "No signed updater artifact was produced for ${{ runner.os }}." >&2
            exit 1
          fi
          if [ ${#human_installers[@]} -eq 0 ]; then
            echo "No human installer was produced for ${{ runner.os }}." >&2
            exit 1
          fi

          installer="${installers[0]}"
          human_installer="${human_installers[0]}"
          signature=$(cat "${installer}.sig")
          version="${GITHUB_REF_NAME#v}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$installer" | sed 's/ /%20/g')"
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$human_installer" | sed 's/ /%20/g')"

          mkdir -p feed/update feed/downloads
          printf '{"%s":{"signature":"%s","url":"%s"}}' "$target" "$signature" "$url" > "feed/update/${target}.json"
          printf '{"%s":{"label":"%s","url":"%s"}}' "$download_key" "$download_label" "$download_url" > "feed/downloads/${download_key}.json"

      - name: Upload the update fragment
        uses: actions/upload-artifact@v7
        with:
          name: feed-${{ runner.os }}
          path: feed

  publish-feed:
    name: Publish Update Feed
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Collect the update fragments
        uses: actions/download-artifact@v7
        with:
          pattern: feed-*
          path: fragments
          merge-multiple: true

      # `latest.json` is what the app polls: one manifest listing every
      # platform's signed installer for this version.
      - name: Merge into latest.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p pages
          jq -s \
            --arg version "$version" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, pub_date: $pub_date, platforms: add}' \
            fragments/update/*.json > pages/latest.json
          jq -s \
            --arg version "$version" \
            --arg release "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            '{version: $version, release: $release, platforms: add}' \
            fragments/downloads/*.json > pages/downloads.json
          cat pages/latest.json
          cat pages/downloads.json

      - name: Create the download page
        run: |
          cat > pages/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Media Bridge Downloads</title>
              <style>
                :root {
                  color-scheme: light dark;
                  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                  background: #0f1720;
                  color: #f8fafc;
                }
                body {
                  min-height: 100vh;
                  margin: 0;
                  display: grid;
                  place-items: center;
                  padding: 32px;
                  box-sizing: border-box;
                }
                main {
                  width: min(100%, 680px);
                }
                h1 {
                  margin: 0 0 10px;
                  font-size: clamp(34px, 8vw, 64px);
                  line-height: 1;
                  letter-spacing: 0;
                }
                p {
                  margin: 0 0 24px;
                  color: #cbd5e1;
                  font-size: 18px;
                  line-height: 1.5;
                }
                .primary {
                  display: inline-flex;
                  align-items: center;
                  justify-content: center;
                  min-height: 52px;
                  padding: 0 22px;
                  border-radius: 8px;
                  background: #38bdf8;
                  color: #06111f;
                  font-weight: 750;
                  text-decoration: none;
                }
                .links {
                  display: flex;
                  flex-wrap: wrap;
                  gap: 14px 18px;
                  margin-top: 24px;
                }
                .links a {
                  color: #93c5fd;
                }
                .meta {
                  margin-top: 20px;
                  color: #94a3b8;
                  font-size: 14px;
                }
              </style>
            </head>
            <body>
              <main>
                <h1>Media Bridge</h1>
                <p id="summary">Loading the latest installer...</p>
                <a class="primary" id="primary" href="https://github.com/jamalgillis/CsnMediaBridge/releases">View downloads</a>
                <div class="links" id="links"></div>
                <div class="meta" id="meta"></div>
              </main>
              <script>
                const fallbackRelease = "https://github.com/jamalgillis/CsnMediaBridge/releases";
                const platformName = () => {
                  const ua = navigator.userAgent || "";
                  const platform = navigator.platform || "";
                  if (/Mac|Darwin/.test(platform) || /Mac OS X/.test(ua)) return "macos";
                  if (/Win/.test(platform) || /Windows/.test(ua)) return "windows";
                  return "";
                };

                fetch("downloads.json", { cache: "no-store" })
                  .then((response) => {
                    if (!response.ok) throw new Error("downloads.json unavailable");
                    return response.json();
                  })
                  .then((data) => {
                    const platforms = data.platforms || {};
                    const preferredKey = platformName();
                    const preferred = platforms[preferredKey] || platforms.macos || platforms.windows;
                    const primary = document.getElementById("primary");
                    const summary = document.getElementById("summary");
                    const links = document.getElementById("links");
                    const meta = document.getElementById("meta");

                    if (preferred) {
                      primary.href = preferred.url;
                      primary.textContent = preferred.label;
                      summary.textContent = "Download the latest production installer.";
                    }

                    Object.entries(platforms).forEach(([key, item]) => {
                      const link = document.createElement("a");
                      link.href = item.url;
                      link.textContent = item.label;
                      links.appendChild(link);
                    });

                    const release = document.createElement("a");
                    release.href = data.release || fallbackRelease;
                    release.textContent = "Release notes";
                    links.appendChild(release);

                    meta.textContent = data.version ? `Latest version: ${data.version}` : "";
                  })
                  .catch(() => {
                    document.getElementById("summary").textContent = "Downloads are available from the GitHub releases page.";
                  });
              </script>
            </body>
          </html>
          HTML

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
