name = "csn-credential-broker"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Public, non-secret configuration. Everything sensitive is a secret — see
# README.md — and is never committed.
[vars]
CF_ACCOUNT_ID = ""
R2_BUCKET = "csn-dist"
B2_BUCKET_ID = ""
# How long a minted credential lives. Long enough for a large transfer to
# finish, short enough that a leaked one stops mattering quickly.
CREDENTIAL_TTL_SECONDS = "21600"
# Prefixes a station may be granted. Anything outside these is refused, so a
# compromised station token cannot reach another team's assets.
R2_ALLOWED_PREFIXES = "streaming/vod/,posters/"
B2_ALLOWED_PREFIXES = "masters/,offload-stills/"
# Object prefixes /media will serve. Everything else is refused, so the archive
# is not reachable through the playback route.
MEDIA_ALLOWED_PREFIXES = "streaming/vod/,posters/"
# The library that answers who owns an object key.
CONVEX_URL = "https://csn-sports.convex.cloud"
# Enforce that a station's organization owns the asset it is asking for. Leave
# this off until `media/ownership:ownershipCoverage` reports zero unowned rows —
# an unstamped asset is refused, not served. See README.md.
REQUIRE_TEAM_MATCH = "false"

# Playback streams straight out of the bucket through a binding, so the Worker
# needs no storage credentials of its own to read.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "csn-dist"
